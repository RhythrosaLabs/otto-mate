<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otto Universal AI - Files</title>
    <style>
        :root {
            --bg: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-tertiary: #e8eaed;
            --text: #202124;
            --text-secondary: #5f6368;
            --text-tertiary: #80868b;
            --border: #dadce0;
            --accent: #1a73e8;
            --accent-hover: #1557b0;
            --success: #1e8e3e;
            --error: #d93025;
            --warning: #f9ab00;
            --shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            --shadow-lg: 0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
        }

        [data-theme="dark"] {
            --bg: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text: #f0f6fc;
            --text-secondary: #8b949e;
            --text-tertiary: #6e7681;
            --border: #30363d;
            --accent: #58a6ff;
            --accent-hover: #1f6feb;
            --shadow: 0 2px 8px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.6);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Header */
        .header {
            background: var(--bg);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text);
        }
        
        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .logo-text h1 {
            font-size: 16px;
            font-weight: 500;
        }
        
        .logo-text span {
            font-size: 12px;
            color: var(--text-secondary);
            display: none;
        }
        
        .nav-links {
            display: flex;
            gap: 4px;
        }
        
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.15s;
            font-size: 13px;
            font-weight: 500;
        }
        
        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text);
            background: var(--bg-secondary);
        }
        
        /* Main Content */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.15s;
        }

        .stat-card:hover {
            box-shadow: var(--shadow);
        }
        
        .stat-card .icon {
            width: 36px;
            height: 36px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            font-size: 18px;
        }
        
        .stat-card .value {
            font-size: 24px;
            font-weight: 600;
            color: var(--text);
        }
        
        .stat-card .label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        
        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .toolbar-left {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .search-box {
            position: relative;
        }
        
        .search-box input {
            padding: 8px 12px 8px 36px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            width: 280px;
            font-size: 13px;
            outline: none;
            transition: all 0.15s;
        }
        
        .search-box input:focus {
            border-color: var(--accent);
            background: var(--bg);
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
        }
        
        .search-box svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--text-tertiary);
        }
        
        .filter-select {
            padding: 8px 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            outline: none;
        }
        
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text);
        }
        
        .btn:hover {
            background: var(--bg-secondary);
            border-color: var(--text-tertiary);
        }
        
        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
        }
        
        .btn-primary:hover {
            background: var(--accent-hover);
        }
        
        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text);
        }
        
        .btn-secondary:hover {
            background: var(--bg-tertiary);
        }
        
        /* View Toggle */
        .view-toggle {
            display: flex;
            background: var(--bg-secondary);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        
        .view-toggle button {
            padding: 6px 12px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
            font-size: 13px;
        }
        
        .view-toggle button.active {
            background: var(--accent);
            color: white;
        }
        
        /* Files Grid */
        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }
        
        .file-card {
            background: var(--bg-secondary);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid var(--border);
        }
        
        .file-card:hover {
            transform: translateY(-1px);
            border-color: var(--accent);
            box-shadow: var(--shadow);
        }
        
        .file-card.selected {
            border-color: var(--accent);
            background: rgba(26, 115, 232, 0.08);
        }
        
        .file-preview {
            height: 120px;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .file-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .file-preview .icon {
            font-size: 40px;
            color: var(--text-tertiary);
        }
        
        .file-info {
            padding: 12px;
        }
        
        .file-info .name {
            font-weight: 400;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
            color: var(--text);
        }
        
        .file-info .meta {
            font-size: 11px;
            color: var(--text-tertiary);
            display: flex;
            justify-content: space-between;
        }
        
        .file-checkbox {
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            width: 20px;
            height: 20px;
            background: var(--bg-dark);
            border: 2px solid var(--border);
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .file-card:hover .file-checkbox,
        .file-card.selected .file-checkbox {
            opacity: 1;
        }
        
        .file-card.selected .file-checkbox {
            background: var(--primary);
            border-color: var(--primary);
        }
        
        /* Files List */
        .files-list {
            display: none;
        }
        
        .files-list.active {
            display: block;
        }
        
        .files-grid.active {
            display: grid;
        }
        
        .file-row {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.15s;
        }
        
        .file-row:hover {
            background: var(--bg);
            border-color: var(--accent);
            box-shadow: var(--shadow);
        }
        
        .file-row .icon {
            width: 36px;
            height: 36px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 18px;
        }
        
        .file-row .details {
            flex: 1;
        }
        
        .file-row .name {
            font-weight: 500;
        }
        
        .file-row .meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        
        .file-row .actions {
            display: flex;
            gap: 0.5rem;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .file-row:hover .actions {
            opacity: 1;
        }
        
        .file-row .actions button {
            padding: 0.5rem;
            background: var(--bg-dark);
            border: none;
            border-radius: 6px;
            color: var(--text-secondary);
            cursor: pointer;
        }
        
        .file-row .actions button:hover {
            color: var(--text-primary);
        }
        
        /* Upload Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal-overlay.show {
            display: flex;
        }
        
        .modal {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal h2 {
            margin-bottom: 1.5rem;
        }
        
        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }
        
        .drop-zone .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .drop-zone p {
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }
        
        .drop-zone input {
            display: none;
        }
        
        .upload-progress {
            margin-top: 1.5rem;
            display: none;
        }
        
        .upload-progress.show {
            display: block;
        }
        
        .progress-bar {
            height: 8px;
            background: var(--bg-input);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-bar-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s;
        }
        
        .upload-status {
            margin-top: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
        }
        
        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        
        .empty-state h3 {
            margin-bottom: 0.5rem;
        }
        
        .empty-state p {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }
        
        /* File Detail Sidebar */
        .file-detail {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100vh;
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            padding: 2rem;
            overflow-y: auto;
            transition: right 0.3s;
            z-index: 200;
        }
        
        .file-detail.open {
            right: 0;
        }
        
        .file-detail-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--bg-input);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 1.25rem;
        }
        
        .file-detail-preview {
            width: 100%;
            height: 200px;
            background: var(--bg-input);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }
        
        .file-detail-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .file-detail h3 {
            word-break: break-all;
            margin-bottom: 1rem;
        }
        
        .file-detail-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .file-detail-meta .item {
            background: var(--bg-input);
            padding: 0.75rem;
            border-radius: 8px;
        }
        
        .file-detail-meta .label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        
        .file-detail-meta .value {
            font-weight: 500;
            margin-top: 0.25rem;
        }
        
        .file-detail-actions {
            display: flex;
            gap: 0.75rem;
        }
        
        .file-detail-actions .btn {
            flex: 1;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }
        
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .toast.success {
            border-color: var(--success);
        }
        
        .toast.error {
            border-color: var(--error);
        }
        
        @media (max-width: 768px) {
            .main-content {
                padding: 1rem;
            }
            
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-box input {
                width: 100%;
            }
            
            .files-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            
            .file-detail {
                width: 100%;
                right: -100%;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <a href="/" class="logo">
            <div class="logo-icon">🤖</div>
            <div class="logo-text">
                <h1>Otto Universal</h1>
                <span>Files</span>
            </div>
        </a>
        <nav class="nav-links">
            <a href="/">Chat</a>
            <a href="/files-page" class="active">Files</a>
            <a href="/settings-page">Settings</a>
        </nav>
    </header>
    
    <!-- Main Content -->
    <main class="main-content">
        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon">📁</div>
                <div class="value" id="stat-total">0</div>
                <div class="label">Total Files</div>
            </div>
            <div class="stat-card">
                <div class="icon">💾</div>
                <div class="value" id="stat-size">0 MB</div>
                <div class="label">Storage Used</div>
            </div>
            <div class="stat-card">
                <div class="icon">🖼️</div>
                <div class="value" id="stat-images">0</div>
                <div class="label">Images</div>
            </div>
            <div class="stat-card">
                <div class="icon">📄</div>
                <div class="value" id="stat-docs">0</div>
                <div class="label">Documents</div>
            </div>
        </div>
        
        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-left">
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="M21 21l-4.35-4.35"/>
                    </svg>
                    <input type="text" id="search-input" placeholder="Search files...">
                </div>
                <select class="filter-select" id="category-filter">
                    <option value="">All Categories</option>
                    <option value="images">Images</option>
                    <option value="documents">Documents</option>
                    <option value="audio">Audio</option>
                    <option value="video">Video</option>
                    <option value="generated">Generated</option>
                </select>
            </div>
            <div class="toolbar-right" style="display: flex; gap: 1rem;">
                <div class="view-toggle">
                    <button class="active" data-view="grid">⊞</button>
                    <button data-view="list">☰</button>
                </div>
                <button class="btn btn-primary" onclick="openUploadModal()">
                    <span>+</span> Upload
                </button>
            </div>
        </div>
        
        <!-- Files Grid -->
        <div class="files-grid active" id="files-grid"></div>
        
        <!-- Files List -->
        <div class="files-list" id="files-list"></div>
        
        <!-- Empty State -->
        <div class="empty-state" id="empty-state" style="display: none;">
            <div class="icon">📂</div>
            <h3>No files yet</h3>
            <p>Upload your first file to get started</p>
            <button class="btn btn-primary" onclick="openUploadModal()">Upload File</button>
        </div>
    </main>
    
    <!-- Upload Modal -->
    <div class="modal-overlay" id="upload-modal">
        <div class="modal">
            <h2>Upload Files</h2>
            <div class="drop-zone" id="drop-zone">
                <div class="icon">📤</div>
                <p>Drag & drop files here or click to browse</p>
                <button class="btn btn-secondary">Choose Files</button>
                <input type="file" id="file-input" multiple>
            </div>
            <div class="upload-progress" id="upload-progress">
                <div class="progress-bar">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
                <div class="upload-status" id="upload-status">Uploading...</div>
            </div>
            <div style="margin-top: 1.5rem; display: flex; justify-content: flex-end; gap: 0.75rem;">
                <button class="btn btn-secondary" onclick="closeUploadModal()">Cancel</button>
            </div>
        </div>
    </div>
    
    <!-- File Detail Sidebar -->
    <div class="file-detail" id="file-detail">
        <button class="file-detail-close" onclick="closeFileDetail()">×</button>
        <div class="file-detail-preview" id="detail-preview"></div>
        <h3 id="detail-name"></h3>
        <div class="file-detail-meta">
            <div class="item">
                <div class="label">Size</div>
                <div class="value" id="detail-size"></div>
            </div>
            <div class="item">
                <div class="label">Type</div>
                <div class="value" id="detail-type"></div>
            </div>
            <div class="item">
                <div class="label">Category</div>
                <div class="value" id="detail-category"></div>
            </div>
            <div class="item">
                <div class="label">Created</div>
                <div class="value" id="detail-created"></div>
            </div>
        </div>
        <div class="file-detail-actions">
            <button class="btn btn-primary" id="download-btn">Download</button>
            <button class="btn btn-secondary" style="background: var(--error);" id="delete-btn">Delete</button>
        </div>
    </div>
    
    <!-- Toast -->
    <div class="toast" id="toast">
        <span class="toast-message"></span>
    </div>
    
    <script>
        let files = [];
        let selectedFile = null;
        let currentView = 'grid';
        
        // Load files on page load
        async function loadFiles() {
            try {
                const category = document.getElementById('category-filter').value;
                let url = '/files?limit=200';
                if (category) url += `&category=${category}`;
                
                const response = await fetch(url);
                const data = await response.json();
                files = data.files;
                renderFiles();
                loadStats();
            } catch (error) {
                showToast('Failed to load files', 'error');
            }
        }
        
        // Load storage stats
        async function loadStats() {
            try {
                const response = await fetch('/files/stats/summary');
                const stats = await response.json();
                
                document.getElementById('stat-total').textContent = stats.total_files;
                document.getElementById('stat-size').textContent = formatSize(stats.total_size);
                document.getElementById('stat-images').textContent = stats.by_category?.images?.count || 0;
                document.getElementById('stat-docs').textContent = stats.by_category?.documents?.count || 0;
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }
        
        // Render files
        function renderFiles() {
            const grid = document.getElementById('files-grid');
            const list = document.getElementById('files-list');
            const empty = document.getElementById('empty-state');
            
            if (files.length === 0) {
                grid.style.display = 'none';
                list.style.display = 'none';
                empty.style.display = 'block';
                return;
            }
            
            empty.style.display = 'none';
            
            // Render grid
            grid.innerHTML = files.map(file => `
                <div class="file-card" data-id="${file.id}" onclick="selectFile('${file.id}')">
                    <div class="file-preview">
                        <div class="file-checkbox"></div>
                        ${file.mime_type.startsWith('image/') 
                            ? `<img src="/files/${file.id}" alt="${file.original_name}">`
                            : `<div class="icon">${getFileIcon(file.mime_type)}</div>`
                        }
                    </div>
                    <div class="file-info">
                        <div class="name">${file.original_name}</div>
                        <div class="meta">
                            <span>${formatSize(file.size)}</span>
                            <span>${formatDate(file.created_at)}</span>
                        </div>
                    </div>
                </div>
            `).join('');
            
            // Render list
            list.innerHTML = files.map(file => `
                <div class="file-row" data-id="${file.id}" onclick="selectFile('${file.id}')">
                    <div class="icon">${getFileIcon(file.mime_type)}</div>
                    <div class="details">
                        <div class="name">${file.original_name}</div>
                        <div class="meta">${formatSize(file.size)} • ${file.category} • ${formatDate(file.created_at)}</div>
                    </div>
                    <div class="actions">
                        <button onclick="event.stopPropagation(); downloadFile('${file.id}')">⬇</button>
                        <button onclick="event.stopPropagation(); deleteFile('${file.id}')">🗑</button>
                    </div>
                </div>
            `).join('');
        }
        
        // Get file icon based on MIME type
        function getFileIcon(mimeType) {
            if (mimeType.startsWith('image/')) return '🖼️';
            if (mimeType.startsWith('video/')) return '🎬';
            if (mimeType.startsWith('audio/')) return '🎵';
            if (mimeType.includes('pdf')) return '📕';
            if (mimeType.includes('word')) return '📝';
            if (mimeType.includes('excel') || mimeType.includes('spreadsheet')) return '📊';
            return '📄';
        }
        
        // Format file size
        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }
        
        // Format date
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString();
        }
        
        // Select file
        function selectFile(id) {
            selectedFile = files.find(f => f.id === id);
            if (!selectedFile) return;
            
            // Update cards
            document.querySelectorAll('.file-card').forEach(c => c.classList.remove('selected'));
            document.querySelector(`.file-card[data-id="${id}"]`)?.classList.add('selected');
            
            // Update detail panel
            const detail = document.getElementById('file-detail');
            const preview = document.getElementById('detail-preview');
            
            if (selectedFile.mime_type.startsWith('image/')) {
                preview.innerHTML = `<img src="/files/${selectedFile.id}" alt="${selectedFile.original_name}">`;
            } else {
                preview.innerHTML = `<div style="font-size: 4rem;">${getFileIcon(selectedFile.mime_type)}</div>`;
            }
            
            document.getElementById('detail-name').textContent = selectedFile.original_name;
            document.getElementById('detail-size').textContent = formatSize(selectedFile.size);
            document.getElementById('detail-type').textContent = selectedFile.mime_type;
            document.getElementById('detail-category').textContent = selectedFile.category;
            document.getElementById('detail-created').textContent = formatDate(selectedFile.created_at);
            
            document.getElementById('download-btn').onclick = () => downloadFile(selectedFile.id);
            document.getElementById('delete-btn').onclick = () => deleteFile(selectedFile.id);
            
            detail.classList.add('open');
        }
        
        // Close file detail
        function closeFileDetail() {
            document.getElementById('file-detail').classList.remove('open');
            document.querySelectorAll('.file-card').forEach(c => c.classList.remove('selected'));
            selectedFile = null;
        }
        
        // Download file
        function downloadFile(id) {
            window.open(`/files/${id}/download`, '_blank');
        }
        
        // Delete file
        async function deleteFile(id) {
            if (!confirm('Delete this file?')) return;
            
            try {
                const response = await fetch(`/files/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    showToast('File deleted', 'success');
                    closeFileDetail();
                    loadFiles();
                } else {
                    showToast('Delete failed', 'error');
                }
            } catch (error) {
                showToast('Delete failed', 'error');
            }
        }
        
        // Upload modal
        function openUploadModal() {
            document.getElementById('upload-modal').classList.add('show');
        }
        
        function closeUploadModal() {
            document.getElementById('upload-modal').classList.remove('show');
            document.getElementById('upload-progress').classList.remove('show');
        }
        
        // File upload handling
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        
        dropZone.addEventListener('click', () => fileInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });
        
        async function handleFiles(fileList) {
            if (fileList.length === 0) return;
            
            const progress = document.getElementById('upload-progress');
            const progressFill = document.getElementById('progress-fill');
            const status = document.getElementById('upload-status');
            
            progress.classList.add('show');
            
            let completed = 0;
            const total = fileList.length;
            
            for (const file of fileList) {
                status.textContent = `Uploading ${file.name}...`;
                
                const formData = new FormData();
                formData.append('file', file);
                
                try {
                    const response = await fetch('/files/upload', {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (response.ok) {
                        completed++;
                        progressFill.style.width = `${(completed / total) * 100}%`;
                    }
                } catch (error) {
                    console.error('Upload failed:', error);
                }
            }
            
            status.textContent = `Uploaded ${completed} of ${total} files`;
            showToast(`Uploaded ${completed} files`, 'success');
            
            setTimeout(() => {
                closeUploadModal();
                loadFiles();
            }, 1000);
        }
        
        // View toggle
        document.querySelectorAll('.view-toggle button').forEach(btn => {
            btn.addEventListener('click', () => {
                currentView = btn.dataset.view;
                
                document.querySelectorAll('.view-toggle button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                document.getElementById('files-grid').classList.toggle('active', currentView === 'grid');
                document.getElementById('files-list').classList.toggle('active', currentView === 'list');
            });
        });
        
        // Search
        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = files.filter(f => 
                f.original_name.toLowerCase().includes(query) ||
                f.category.toLowerCase().includes(query)
            );
            
            // Re-render with filtered files
            const grid = document.getElementById('files-grid');
            const list = document.getElementById('files-list');
            
            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-state"><p>No files match your search</p></div>';
                list.innerHTML = '';
            } else {
                grid.innerHTML = filtered.map(file => `
                    <div class="file-card" data-id="${file.id}" onclick="selectFile('${file.id}')">
                        <div class="file-preview">
                            ${file.mime_type.startsWith('image/') 
                                ? `<img src="/files/${file.id}" alt="${file.original_name}">`
                                : `<div class="icon">${getFileIcon(file.mime_type)}</div>`
                            }
                        </div>
                        <div class="file-info">
                            <div class="name">${file.original_name}</div>
                            <div class="meta">
                                <span>${formatSize(file.size)}</span>
                                <span>${formatDate(file.created_at)}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        });
        
        // Category filter
        document.getElementById('category-filter').addEventListener('change', loadFiles);
        
        // Toast
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.querySelector('.toast-message').textContent = message;
            toast.className = `toast ${type} show`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
        
        // Initialize
        loadFiles();
    </script>
</body>
</html>
