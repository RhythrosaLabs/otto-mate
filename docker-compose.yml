version: '3.8'

services:
  otto-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=postgresql://otto:otto_password@postgres:5432/otto_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
      - chromadb
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - otto-network

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: otto
      POSTGRES_PASSWORD: otto_password
      POSTGRES_DB: otto_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - otto-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - otto-network

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    restart: unless-stopped
    networks:
      - otto-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - otto-api
    restart: unless-stopped
    networks:
      - otto-network

volumes:
  postgres_data:
  redis_data:
  chroma_data:

networks:
  otto-network:
    driver: bridge
