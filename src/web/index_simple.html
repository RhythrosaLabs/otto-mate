<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #ffffff;
            --bg-chat: #f7f7f8;
            --text: #1a1a1a;
            --text-muted: #666;
            --border: #e5e5e5;
            --accent: #10a37f;
            --user-bg: #f7f7f8;
            --assistant-bg: #ffffff;
        }
        
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #212121;
                --bg-chat: #212121;
                --text: #ececec;
                --text-muted: #9a9a9a;
                --border: #444;
                --user-bg: #2f2f2f;
                --assistant-bg: #212121;
            }
        }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Header - minimal */
        header {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .brand {
            font-weight: 600;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .brand-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #10a37f, #1a7f5a);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }
        
        .new-chat {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.15s;
        }
        
        .new-chat:hover {
            background: var(--bg-chat);
        }
        
        /* Chat area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }
        
        .messages {
            max-width: 768px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .message {
            padding: 24px 0;
            display: flex;
            gap: 16px;
            border-bottom: 1px solid var(--border);
        }
        
        .message:last-child {
            border-bottom: none;
        }
        
        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        
        .message.user .message-avatar {
            background: #5436da;
            color: white;
        }
        
        .message.assistant .message-avatar {
            background: var(--accent);
            color: white;
        }
        
        .message-content {
            flex: 1;
            line-height: 1.6;
            font-size: 15px;
        }
        
        .message-content p {
            margin-bottom: 12px;
        }
        
        .message-content p:last-child {
            margin-bottom: 0;
        }
        
        .message-content pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
        }
        
        .message-content code {
            background: var(--bg-chat);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
        }
        
        .message-content pre code {
            background: none;
            padding: 0;
        }
        
        /* Thinking indicator */
        .thinking {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 14px;
            padding: 8px 0;
        }
        
        .thinking-dots {
            display: flex;
            gap: 4px;
        }
        
        .thinking-dots span {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        /* Tool usage */
        .tool-use {
            background: var(--bg-chat);
            border-radius: 8px;
            padding: 12px 16px;
            margin: 12px 0;
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .tool-use::before {
            content: "🔧";
        }
        
        /* Input area */
        .input-area {
            border-top: 1px solid var(--border);
            padding: 20px;
            background: var(--bg);
        }
        
        .input-wrapper {
            max-width: 768px;
            margin: 0 auto;
            position: relative;
        }
        
        .input-box {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            background: var(--bg-chat);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            transition: border-color 0.15s;
        }
        
        .input-box:focus-within {
            border-color: var(--accent);
        }
        
        textarea {
            flex: 1;
            border: none;
            background: none;
            resize: none;
            font-family: inherit;
            font-size: 15px;
            color: var(--text);
            outline: none;
            max-height: 200px;
            line-height: 1.5;
        }
        
        textarea::placeholder {
            color: var(--text-muted);
        }
        
        .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        
        .send-btn:hover {
            background: #0d8a6a;
        }
        
        .send-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
        }
        
        .send-btn svg {
            width: 18px;
            height: 18px;
        }
        
        /* Welcome screen */
        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 40px;
        }
        
        .welcome h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .welcome p {
            color: var(--text-muted);
            margin-bottom: 32px;
        }
        
        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            max-width: 600px;
        }
        
        .suggestion {
            padding: 12px 20px;
            background: var(--bg-chat);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.15s;
        }
        
        .suggestion:hover {
            border-color: var(--accent);
            background: var(--bg);
        }
        
        /* Status dot */
        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
        }
        
        .status-dot.online {
            background: var(--accent);
        }
        
        .status-dot.offline {
            background: #ff4444;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="brand-icon">✦</div>
            <span>Otto</span>
        </div>
        <div style="display: flex; align-items: center; gap: 16px;">
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
            <button class="new-chat" onclick="newChat()">+ New Chat</button>
        </div>
    </header>
    
    <div class="chat-container" id="chatContainer">
        <div class="messages" id="messages">
            <div class="welcome" id="welcome">
                <h1>How can I help you today?</h1>
                <p>I can help with research, coding, analysis, and more.</p>
                <div class="suggestions">
                    <div class="suggestion" onclick="sendSuggestion('Help me write a Python script')">Help me write a Python script</div>
                    <div class="suggestion" onclick="sendSuggestion('Analyze my data')">Analyze my data</div>
                    <div class="suggestion" onclick="sendSuggestion('Research a topic for me')">Research a topic</div>
                    <div class="suggestion" onclick="sendSuggestion('Create content for social media')">Create social content</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="input-area">
        <div class="input-wrapper">
            <div class="input-box">
                <textarea 
                    id="input" 
                    placeholder="Message Otto..." 
                    rows="1"
                    onkeydown="handleKey(event)"
                    oninput="autoResize(this)"
                ></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let sessionId = 'session_' + Date.now();
        let isProcessing = false;
        
        // Check server status
        async function checkStatus() {
            try {
                const res = await fetch('/health');
                const data = await res.json();
                document.getElementById('statusDot').className = 'status-dot online';
                document.getElementById('statusText').textContent = 'Online';
            } catch {
                document.getElementById('statusDot').className = 'status-dot offline';
                document.getElementById('statusText').textContent = 'Offline';
            }
        }
        
        checkStatus();
        setInterval(checkStatus, 30000);
        
        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 200) + 'px';
        }
        
        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }
        
        function newChat() {
            sessionId = 'session_' + Date.now();
            document.getElementById('messages').innerHTML = `
                <div class="welcome" id="welcome">
                    <h1>How can I help you today?</h1>
                    <p>I can help with research, coding, analysis, and more.</p>
                    <div class="suggestions">
                        <div class="suggestion" onclick="sendSuggestion('Help me write a Python script')">Help me write a Python script</div>
                        <div class="suggestion" onclick="sendSuggestion('Analyze my data')">Analyze my data</div>
                        <div class="suggestion" onclick="sendSuggestion('Research a topic for me')">Research a topic</div>
                        <div class="suggestion" onclick="sendSuggestion('Create content for social media')">Create social content</div>
                    </div>
                </div>
            `;
        }
        
        function sendSuggestion(text) {
            document.getElementById('input').value = text;
            sendMessage();
        }
        
        function addMessage(role, content) {
            const welcome = document.getElementById('welcome');
            if (welcome) welcome.remove();
            
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.innerHTML = `
                <div class="message-avatar">${role === 'user' ? '👤' : '✦'}</div>
                <div class="message-content">${formatContent(content)}</div>
            `;
            messages.appendChild(div);
            scrollToBottom();
            return div;
        }
        
        function formatContent(text) {
            if (!text) return '';
            
            // Code blocks
            text = text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            
            // Inline code
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            // Bold
            text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            
            // Paragraphs
            text = text.split('\n\n').map(p => `<p>${p}</p>`).join('');
            
            return text;
        }
        
        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;
        }
        
        async function sendMessage() {
            const input = document.getElementById('input');
            const message = input.value.trim();
            
            if (!message || isProcessing) return;
            
            isProcessing = true;
            document.getElementById('sendBtn').disabled = true;
            
            // Clear input
            input.value = '';
            input.style.height = 'auto';
            
            // Add user message
            addMessage('user', message);
            
            // Add thinking indicator
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'message assistant';
            thinkingDiv.id = 'thinking';
            thinkingDiv.innerHTML = `
                <div class="message-avatar">✦</div>
                <div class="message-content">
                    <div class="thinking">
                        <div class="thinking-dots">
                            <span></span><span></span><span></span>
                        </div>
                        <span>Thinking...</span>
                    </div>
                </div>
            `;
            document.getElementById('messages').appendChild(thinkingDiv);
            scrollToBottom();
            
            try {
                const response = await fetch('/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        session_id: sessionId,
                        stream: true
                    })
                });
                
                if (!response.ok) throw new Error('Request failed');
                
                // Remove thinking indicator
                document.getElementById('thinking')?.remove();
                
                // Create assistant message
                const assistantMsg = addMessage('assistant', '');
                const contentDiv = assistantMsg.querySelector('.message-content');
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';
                let buffer = '';
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop() || '';
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.substring(6));
                                
                                if (data.type === 'content' || data.type === 'text') {
                                    fullText += data.content || '';
                                    contentDiv.innerHTML = formatContent(fullText);
                                    scrollToBottom();
                                } else if (data.type === 'tool_use' || data.type === 'tool') {
                                    const toolDiv = document.createElement('div');
                                    toolDiv.className = 'tool-use';
                                    toolDiv.textContent = `Using ${data.tool || data.name || 'tool'}...`;
                                    contentDiv.appendChild(toolDiv);
                                } else if (data.type === 'complete' || data.type === 'done') {
                                    if (data.response && !fullText) {
                                        fullText = data.response;
                                        contentDiv.innerHTML = formatContent(fullText);
                                    }
                                }
                            } catch (e) {
                                // Skip invalid JSON
                            }
                        }
                    }
                }
                
                // Ensure we have content
                if (!fullText && contentDiv.textContent === '') {
                    contentDiv.innerHTML = '<p>I processed your request. Is there anything specific you\'d like me to help with?</p>';
                }
                
            } catch (error) {
                document.getElementById('thinking')?.remove();
                addMessage('assistant', 'Sorry, I encountered an error. Please try again.');
                console.error('Error:', error);
            }
            
            isProcessing = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('input').focus();
        }
    </script>
</body>
</html>
